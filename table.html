<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>order</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-decoration: none;
        list-style: none;
        color: #454545;
      }
      body {
        background-color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      .admin {
        width: 800px;
        margin: 50px auto;
      }
      .admin h2 {
        margin-bottom: 20px;
      }
      .admin table {
        width: 100%;
        border-spacing: 0;
        border-left: 1px solid #cdd1d5;
        border-bottom: 1px solid #cdd1d5;
        border-collapse: collapse;
      }
      .admin table th {
        background-color: #454545;
        color: #f0f0f0;
      }
      .admin table th,
      .admin table td {
        padding: 10px;
        border: 1px solid #cdd1d5;
        border-bottom: 0;
        border-left: 0;
        font-size: 15px;
        
      }
      .admin table td {
        font-size: 14px;
      }
      .admin tr {
        transition: 0.2s;
        background-color: #fff;
      }
      .admin tr:hover {
        background-color: #f4f5f6;
        cursor: pointer;
      }
      td:last-child {
        text-align: center;
        font-weight: bold;
      }
      td.complete {
        color: #0cb631;
      }
      td.ready {
        color: #ff5521;
      }
      td.delivery {
        color: #336dda;
      }
    </style>
  </head>
  <body>
    <div class="admin">
      <h2>Order Manage</h2>
      <table>
        <thead>
          <tr>
            <th>주문번호</th>
            <th>고객명</th>
            <th>상품명</th>
            <th>수량</th>
            <th>금액</th>
            <th>주문상세</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1001</td>
            <td>김민지</td>
            <td>무선 키보드</td>
            <td>1</td>
            <td>59,000원</td>
            <td class="complete">배송완료</td>
          </tr>
          <tr>
            <td>1001</td>
            <td>김민지</td>
            <td>무선 키보드</td>
            <td>1</td>
            <td>59,000원</td>
            <td class="delivery">배송중</td>
          </tr>
          <tr>
            <td>1001</td>
            <td>김민지</td>
            <td>무선 키보드</td>
            <td>1</td>
            <td>59,000원</td>
            <td class="ready">상품준비중</td>
          </tr>
          <tr>
            <td>1001</td>
            <td>김민지</td>
            <td>무선 키보드</td>
            <td>1</td>
            <td>59,000원</td>
            <td class="complete">배송완료</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
